[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sillisalaatti"
version = "0.1.0"
description = "Controlled experiments in quantized, error-correcting streaming memory"
requires-python = ">=3.10"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
test = ["pytest>=8"]
plots = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["sillisalaatti*"]

[tool.setuptools.package-data]
"sillisalaatti._vendor.phasegraph" = ["LICENSE", "PROVENANCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

