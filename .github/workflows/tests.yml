name: CPU correctness and checkpoint smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test,plots]"
      - run: python -m pytest -q
      - run: python -m sillisalaatti.benchmark --checkpoint checkpoints/meta/seed41-phase_first_order.pt --count 4 --horizon 4 --eta 0.0625 --output runs/smoke
      - run: python -m sillisalaatti.train --episodes 2 --batch-size 2 --train-horizons 1 4 --eval-count 4 --eval-horizon 4 --output runs/training-smoke
